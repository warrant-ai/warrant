name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  schema-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmp schema/decision-record.v0.json python/src/warrant/schema/decision-record.v0.json
          cmp schema/decision-record.v0.json js/schema/decision-record.v0.json
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: warrant
          POSTGRES_PASSWORD: warrant
          POSTGRES_DB: warrant
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U warrant" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      WARRANT_TEST_PG: postgresql://warrant:warrant@127.0.0.1:55432/warrant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "python[dev]"
      - run: pytest python
      - run: python -m build --outdir dist python
  action:
    # Runs the replay action the way a user's workflow would, against the lending gallery.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baseline target changes nothing
        id: baseline
        uses: ./action
        with:
          set: lending-edge
          against: underwriter-v2.3
          working-directory: examples/gallery/lending
          install: ./python[policy]
      - name: Changed target flips decisions and fails the check
        id: changed
        continue-on-error: true
        uses: ./action
        with:
          set: lending-edge
          against: underwriter-v2.4
          working-directory: examples/gallery/lending
          install: ./python[policy]
      - name: Outcomes are what the gallery documents
        env:
          BASELINE: ${{ steps.baseline.outputs.passed }}/${{ steps.baseline.outputs.flipped }}
          CHANGED: ${{ steps.changed.outcome }}/${{ steps.changed.outputs.passed }}/${{ steps.changed.outputs.flipped }}
        run: |
          test "$BASELINE" = "true/0"
          test "$CHANGED" = "failure/false/13"
  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: js
      - run: npm test
        working-directory: js
      - run: npm run typecheck
        if: matrix.node == 22
        working-directory: js
      - run: npm pack --dry-run
        working-directory: js
