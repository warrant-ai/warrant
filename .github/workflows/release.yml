# Publishes both packages on a version tag (v0.0.1). No stored registry tokens:
# both PyPI and npm use trusted publishing (OIDC) bound to this repository,
# this workflow file, and the environments `pypi` and `npm`.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --outdir dist python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
        working-directory: js
      - run: npm test
        working-directory: js
      - run: npm publish --access public
        working-directory: js
