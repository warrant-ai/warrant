[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "warrantai"
version = "0.9.0.dev0"
description = "Warrant: the decision ledger for AI agents. Record every consequential agent action with its mandate, evidence, cost and outcome, and replay real decisions before you ship a change."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AI Foundry Ventures" }]
keywords = ["ai-agents", "audit", "decision-records", "governance", "llm", "observability", "policy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Logging",
]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
policy = ["cel-python>=0.5"]
otel = ["opentelemetry-sdk>=1.20"]
collector = ["psycopg[binary]>=3.2", "fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42"]
mcp = ["mcp>=2,<3"]
claude-agent = ["claude-agent-sdk>=0.2"]
langgraph = ["langgraph>=1.0"]
temporal = ["temporalio>=1.32"]
jev = ["typesafe-sdk>=0.7"]
laya = ["laya>=0.3.20"]
sign = ["cryptography>=42"]
dev = ["pytest>=8", "build>=1.2", "cel-python>=0.5", "opentelemetry-sdk>=1.20", "psycopg[binary]>=3.2", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "mcp>=2,<3", "claude-agent-sdk>=0.2", "langgraph>=1.0", "temporalio>=1.32", "typesafe-sdk>=0.7", "cryptography>=42"]

[project.scripts]
warrant = "warrant.cli:main"

[project.urls]
Homepage = "https://warrantai.dev"
Source = "https://github.com/warrant-ai/warrant"
Issues = "https://github.com/warrant-ai/warrant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]

[tool.hatch.build.targets.sdist]
include = ["src/warrant", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
